    <!-- Set the html lang before first paint, mirroring the i18n language choice
         (saved preference, else browser language). Without this the shell says
         "en" while Dutch visitors see Dutch content, and Chrome pops up its
         translate bar on every visit. -->
    <script>
      try {
        var p = location.pathname
        var urlNl = p === '/nl' || p.indexOf('/nl/') === 0
        var nivLang = urlNl ? 'nl' : localStorage.getItem('nivora.lang') || navigator.language || 'en'
        document.documentElement.lang = nivLang.toLowerCase().indexOf('nl') === 0 ? 'nl' : 'en'
      } catch (e) {}
    </script>
